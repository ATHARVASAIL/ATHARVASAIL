name: Metrics Dashboard

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Classic PAT with scopes: public_repo, read:user
          # Saved as repo secret METRICS_TOKEN
          token: ${{ secrets.METRICS_TOKEN }}
          user: ATHARVASAIL
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_order: base.header, isocalendar, languages, activity, community
          config_theme: dark

          # Isometric contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Language breakdown
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_colors: >-
            0:00b4ff, 1:22d3ee, 2:0086c3, 3:38bdf8,
            4:0ea5e9, 5:7dd3fc, 6:0369a1, 7:67e8f9

          # Blue sci-fi skin over the dark theme
          extras_css: |
            svg { background: #0a0e1a !important; }
            h2, .field a, a { color: #00b4ff !important; }
            .field svg, .row svg { fill: #22d3ee; }
            text { fill: #e6edf3; }